name: Build APK and icon pack

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Unpack icon pack (icons + tools)
        run: |
          if [ -f liquidglass-all.zip ]; then
            unzip -o -q liquidglass-all.zip -d /tmp/pack
            cp -r /tmp/pack/liquidglass-all/icon-pack ./icon-pack
            mkdir -p iconpack/src/main/res/drawable-nodpi
            cp /tmp/pack/liquidglass-all/icon-pack/icons/*.png iconpack/src/main/res/drawable-nodpi/
          fi
          ls iconpack/src/main/res/drawable-nodpi | wc -l

      - name: Build APKs
        run: |
          gradle :app:assembleDebug :app:assembleRelease :iconpack:assembleRelease --no-daemon --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/DailyCalendar.apk
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk out/DailyCalendar-release.apk
          fi
          cp iconpack/build/outputs/apk/release/iconpack-release.apk out/LiquidGlass-icon-pack.apk
          ls -l out

      - name: Upload calendar app APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyCalendarIcon-apk
          path: |
            out/DailyCalendar.apk
            out/DailyCalendar-release.apk
          if-no-files-found: error

      - name: Upload icon pack APK
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-icon-pack-apk
          path: out/LiquidGlass-icon-pack.apk
          if-no-files-found: error

      - name: Upload icon pack sources
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlass-icon-pack
          path: icon-pack/
          if-no-files-found: ignore
