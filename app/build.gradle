plugins { id 'com.android.application' }

android {
    namespace 'com.liquidglass.dailycal'
    compileSdk 34

    defaultConfig {
        applicationId 'com.liquidglass.dailycal'
        minSdk 26
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        debug {
            applicationIdSuffix ''
        }
        release {
            minifyEnabled false
            // signed with the runner's debug key so the APK installs without a keystore
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
